<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>FRENZY CHEATS - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at top left,
        #241044,
        transparent 35%
    ),
    #050816;

    color:white;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* ================= LOGIN ================= */

#loginPage{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}

.loginBox{

    width:100%;

    max-width:430px;

    padding:35px;

    border-radius:22px;

    background:
    rgba(15,23,42,.95);

    border:
    1px solid
    rgba(168,85,247,.35);

    box-shadow:
    0 0 60px
    rgba(124,58,237,.2);

}

.loginLogo{

    width:80px;

    height:80px;

    object-fit:cover;

    border-radius:20px;

    display:block;

    margin:0 auto 20px;

    box-shadow:
    0 0 30px
    rgba(168,85,247,.4);

}

.loginBox h1{

    text-align:center;

    margin-bottom:8px;

}

.loginBox h1 span{
    color:#a855f7;
}

.loginBox p{

    text-align:center;

    color:#94a3b8;

    margin-bottom:30px;

}

.inputGroup{

    margin-bottom:18px;

}

.inputGroup label{

    display:block;

    margin-bottom:7px;

    color:#cbd5e1;

    font-size:13px;

}

.inputGroup input,
.inputGroup textarea,
.inputGroup select{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:
    1px solid
    #334155;

    background:#0f172a;

    color:white;

    outline:none;

}

.inputGroup textarea{

    min-height:100px;

    resize:vertical;

}

.inputGroup input:focus,
.inputGroup textarea:focus,
.inputGroup select:focus{

    border-color:#a855f7;

}

.loginBtn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7c3aed,
        #db2777
    );

}

#errorMessage{

    color:#f87171;

    text-align:center;

    margin-top:15px;

    font-size:13px;

}


/* ================= ADMIN ================= */

#adminPage{
    display:none;
}

.navbar{

    position:sticky;

    top:0;

    z-index:100;

    padding:15px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
    rgba(3,5,12,.92);

    backdrop-filter:blur(15px);

    border-bottom:
    1px solid
    #1e293b;

}

.logoBox{

    display:flex;

    align-items:center;

    gap:12px;

}

.logoBox img{

    width:42px;

    height:42px;

    border-radius:10px;

    object-fit:cover;

}

.logo{

    font-size:20px;

    font-weight:bold;

}

.logo span{
    color:#a855f7;
}

.logoutBtn{

    padding:10px 18px;

    border-radius:8px;

    border:
    1px solid
    #ef4444;

    color:#f87171;

    background:transparent;

}

.container{

    max-width:1250px;

    margin:auto;

    padding:35px 20px;

}

.dashboard{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:25px;

}

.panel{

    background:
    rgba(15,23,42,.85);

    border:
    1px solid
    #1e293b;

    border-radius:18px;

    padding:25px;

}

.panel h2{

    margin-bottom:25px;

}

.formGrid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:15px;

}

.full{

    grid-column:
    1 / -1;

}

.fileBox{

    padding:15px;

    border:
    1px dashed
    #475569;

    border-radius:12px;

    background:
    rgba(255,255,255,.02);

}

.fileBox input{

    margin-top:10px;

    width:100%;

}

.preview{

    margin-top:15px;

    display:none;

}

.preview img{

    width:100px;

    height:100px;

    object-fit:cover;

    border-radius:15px;

    border:
    1px solid
    #334155;

}

.checkbox{

    display:flex;

    align-items:center;

    gap:10px;

    margin:15px 0;

}

.checkbox input{

    width:18px;

    height:18px;

}

.saveBtn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7c3aed,
        #db2777
    );

}

.cancelBtn{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:
    1px solid
    #334155;

    border-radius:10px;

    background:transparent;

    color:white;

    display:none;

}

.apkList{

    display:grid;

    gap:15px;

}

.apkItem{

    display:flex;

    align-items:center;

    gap:15px;

    padding:15px;

    border-radius:12px;

    background:#0b1120;

    border:
    1px solid
    #1e293b;

}

.apkItem img{

    width:60px;

    height:60px;

    object-fit:cover;

    border-radius:12px;

}

.apkInfo{

    flex:1;

}

.apkInfo h3{

    margin-bottom:5px;

}

.apkInfo p{

    color:#64748b;

    font-size:12px;

}

.actions{

    display:flex;

    gap:7px;

}

.editBtn,
.deleteBtn{

    padding:8px 12px;

    border-radius:7px;

    border:none;

    color:white;

}

.editBtn{
    background:#2563eb;
}

.deleteBtn{
    background:#dc2626;
}

.status{

    padding:12px;

    margin-bottom:20px;

    border-radius:8px;

    display:none;

}

.success{

    display:block;

    background:
    rgba(34,197,94,.1);

    color:#4ade80;

}

.error{

    display:block;

    background:
    rgba(239,68,68,.1);

    color:#f87171;

}

@media(max-width:850px){

    .dashboard{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    .formGrid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .apkItem{
        flex-wrap:wrap;
    }

    .actions{
        width:100%;
    }

    .actions button{
        flex:1;
    }

}

</style>

</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

<div class="loginBox">

<img
class="loginLogo"
src="https://i.postimg.cc/3J5LSbsv/6235347681576423125-99.jpg"
>

<h1>
FRENZY <span>CHEATS</span>
</h1>

<p>
Secure Admin Panel
</p>

<form id="loginForm">

<div class="inputGroup">

<label>Admin Email</label>

<input
type="email"
id="email"
autocomplete="username"
required
>

</div>

<div class="inputGroup">

<label>Admin Password</label>

<input
type="password"
id="password"
autocomplete="current-password"
required
>

</div>

<button
class="loginBtn"
type="submit"
>
LOGIN TO ADMIN PANEL
</button>

<div id="errorMessage"></div>

</form>

</div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage">

<nav class="navbar">

<div class="logoBox">

<img
src="https://i.postimg.cc/3J5LSbsv/6235347681576423125-99.jpg"
>

<div class="logo">
FRENZY <span>CHEATS</span>
</div>

</div>

<button
class="logoutBtn"
id="logoutBtn"
>
LOGOUT
</button>

</nav>


<div class="container">

<div
id="statusMessage"
class="status"
></div>


<div class="dashboard">


<!-- ================= FORM ================= -->

<div class="panel">

<h2>
Add / Edit APK
</h2>

<form id="apkForm">

<div class="formGrid">


<div class="inputGroup">

<label>APK Name *</label>

<input
type="text"
id="apkName"
required
>

</div>


<div class="inputGroup">

<label>Version</label>

<input
type="text"
id="apkVersion"
placeholder="v1.0.0"
>

</div>


<div class="inputGroup">

<label>Category</label>

<select id="apkCategory">

<option>Android</option>

<option>Free Fire</option>

<option>Free Fire MAX</option>

<option>Tools</option>

</select>

</div>


<div class="inputGroup">

<label>Badge</label>

<input
type="text"
id="apkBadge"
value="AVAILABLE"
>

</div>


<div class="inputGroup full">

<label>APK Logo / Image</label>

<div class="fileBox">

<input
type="file"
id="logoFile"
accept="image/*"
>

<div class="preview" id="imagePreview">

<img id="previewImage">

</div>

</div>

</div>


<div class="inputGroup full">

<label>APK Download URL *</label>

<input
type="url"
id="downloadUrl"
placeholder="https://example.com/app.apk"
required
>

</div>


<div class="inputGroup full">

<label>Short Description</label>

<input
type="text"
id="shortDescription"
>

</div>


<div class="inputGroup full">

<label>Full Description</label>

<textarea
id="description"
></textarea>

</div>


<div class="inputGroup full">

<label>Features</label>

<input
type="text"
id="features"
placeholder="ESP, AIM, Fast, Stable"
>

</div>

</div>


<label class="checkbox">

<input
type="checkbox"
id="published"
checked
>

Publish this APK on website

</label>


<button
class="saveBtn"
type="submit"
id="saveBtn"
>
SAVE APK
</button>


<button
class="cancelBtn"
type="button"
id="cancelEdit"
>
CANCEL EDIT
</button>

</form>

</div>


<!-- ================= LIST ================= -->

<div class="panel">

<h2>
All APKs
</h2>

<div
class="apkList"
id="apkList"
>
Loading...
</div>

</div>


</div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="firebase.js"></script>


<script>

let editingId = null;

let apkCache = [];


// ================= AUTH =================

frenzyAuth.onAuthStateChanged(user => {

    if(user){

        loginPage.style.display = "none";

        adminPage.style.display = "block";

        loadAPKs();

    }else{

        loginPage.style.display = "flex";

        adminPage.style.display = "none";

    }

});


// ================= LOGIN =================

loginForm.addEventListener(
"submit",
async e => {

    e.preventDefault();

    errorMessage.textContent =
        "Logging in...";

    try{

        await adminLogin(
            email.value,
            password.value
        );

        errorMessage.textContent = "";

    }catch(err){

        errorMessage.textContent =
            firebaseError(err);

    }

});


// ================= LOGOUT =================

logoutBtn.onclick = async () => {

    await adminLogout();

};


// ================= IMAGE PREVIEW =================

logoFile.addEventListener(
"change",
() => {

    const file =
        logoFile.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = e => {

        previewImage.src =
            e.target.result;

        imagePreview.style.display =
            "block";

    };

    reader.readAsDataURL(file);

});


// ================= SAVE =================

apkForm.addEventListener(
"submit",
async e => {

    e.preventDefault();

    saveBtn.disabled = true;

    saveBtn.textContent =
        "SAVING...";

    try{

        let logoUrl =
            editingId
            ? (
                apkCache.find(
                    x => x.id === editingId
                )?.logoUrl || ""
            )
            : "";

        const file =
            logoFile.files[0];

        if(file){

            saveBtn.textContent =
                "UPLOADING IMAGE...";

            logoUrl =
                await uploadAPKLogo(file);

        }


        const data = {

            name:
                apkName.value.trim(),

            version:
                apkVersion.value.trim(),

            category:
                apkCategory.value,

            badge:
                apkBadge.value.trim(),

            logoUrl:
                logoUrl,

            downloadUrl:
                downloadUrl.value.trim(),

            shortDescription:
                shortDescription.value.trim(),

            description:
                description.value.trim(),

            features:
                features.value
                .split(",")
                .map(x => x.trim())
                .filter(Boolean),

            published:
                published.checked

        };


        if(editingId){

            await updateAPK(
                editingId,
                data
            );

            showStatus(
                "APK updated successfully!",
                "success"
            );

        }else{

            await addAPK(
                data
            );

            showStatus(
                "APK added successfully!",
                "success"
            );

        }


        resetForm();

        await loadAPKs();

    }catch(err){

        console.error(err);

        showStatus(
            err.message,
            "error"
        );

    }finally{

        saveBtn.disabled = false;

        saveBtn.textContent =
            "SAVE APK";

    }

});


// ================= LOAD =================

async function loadAPKs(){

    apkList.innerHTML =
        "Loading...";

    try{

        apkCache =
            await getAllAPKs();

        if(!apkCache.length){

            apkList.innerHTML =
                "No APKs added yet.";

            return;

        }

        apkList.innerHTML = "";

        apkCache.forEach(apk => {

            const item =
                document.createElement("div");

            item.className =
                "apkItem";

            const image =
                apk.logoUrl
                ||
                "https://i.postimg.cc/3J5LSbsv/6235347681576423125-99.jpg";

            item.innerHTML = `

                <img
                src="${escapeHTML(image)}"
                >

                <div class="apkInfo">

                    <h3>
                    ${escapeHTML(
                        apk.name ||
                        "Unnamed APK"
                    )}
                    </h3>

                    <p>

                    ${escapeHTML(
                        apk.category ||
                        "Android"
                    )}

                    •
                    ${
                        apk.published
                        ? "Published"
                        : "Hidden"
                    }

                    •
                    ${
                        apk.downloadCount || 0
                    }
                    downloads

                    </p>

                </div>

                <div class="actions">

                    <button
                    class="editBtn"
                    onclick="editAPK('${apk.id}')"
                    >
                    Edit
                    </button>

                    <button
                    class="deleteBtn"
                    onclick="removeAPK('${apk.id}')"
                    >
                    Delete
                    </button>

                </div>

            `;

            apkList.appendChild(item);

        });

    }catch(err){

        console.error(err);

        apkList.innerHTML =
            "Error loading APKs.";

    }

}


// ================= EDIT =================

window.editAPK = function(id){

    const apk =
        apkCache.find(
            x => x.id === id
        );

    if(!apk) return;

    editingId = id;

    apkName.value =
        apk.name || "";

    apkVersion.value =
        apk.version || "";

    apkCategory.value =
        apk.category || "Android";

    apkBadge.value =
        apk.badge || "";

    downloadUrl.value =
        apk.downloadUrl || "";

    shortDescription.value =
        apk.shortDescription || "";

    description.value =
        apk.description || "";

    features.value =
        Array.isArray(apk.features)
        ? apk.features.join(", ")
        : "";

    published.checked =
        apk.published === true;

    imagePreview.style.display =
        apk.logoUrl
        ? "block"
        : "none";

    if(apk.logoUrl){

        previewImage.src =
            apk.logoUrl;

    }

    cancelEdit.style.display =
        "block";

    saveBtn.textContent =
        "UPDATE APK";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


// ================= DELETE =================

window.removeAPK = async function(id){

    if(!confirm(
        "Are you sure you want to delete this APK?"
    )){
        return;
    }

    try{

        await deleteAPK(id);

        showStatus(
            "APK deleted successfully!",
            "success"
        );

        await loadAPKs();

    }catch(err){

        showStatus(
            err.message,
            "error"
        );

    }

};


// ================= RESET =================

cancelEdit.onclick =
resetForm;

function resetForm(){

    editingId = null;

    apkForm.reset();

    published.checked =
        true;

    imagePreview.style.display =
        "none";

    previewImage.src =
        "";

    cancelEdit.style.display =
        "none";

    saveBtn.textContent =
        "SAVE APK";

}


// ================= STATUS =================

function showStatus(
message,
type
){

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status " + type;

    setTimeout(
        () => {
            statusMessage.className =
                "status";
        },
        4000
    );

}


// ================= ERROR =================

function firebaseError(error){

    switch(error.code){

        case "auth/invalid-credential":
            return "Invalid email or password.";

        case "auth/invalid-email":
            return "Invalid email address.";

        case "auth/user-not-found":
            return "Admin account not found.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/too-many-requests":
            return "Too many login attempts.";

        default:
            return error.message ||
                "Login failed.";

    }

}


// ================= ESCAPE =================

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value || "");

    return div.innerHTML;

}

</script>

</body>
</html>
