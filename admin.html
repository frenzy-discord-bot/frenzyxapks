<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FRENZY CHEATS - Admin Panel</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
  radial-gradient(
    circle at top left,
    #211044,
    transparent 35%
  ),
  #050812;

  color: #e8edf7;

  font-family:
  Arial,
  Helvetica,
  sans-serif;

}

.container {

  width: min(
    1100px,
    94%
  );

  margin: 40px auto;

}

.card {

  background:
  rgba(
    15,
    23,
    42,
    0.95
  );

  border:
  1px solid
  #27324a;

  border-radius:
  20px;

  padding:
  25px;

  margin-bottom:
  25px;

  box-shadow:
  0 20px 60px
  rgba(
    0,
    0,
    0,
    .35
  );

}

h1 {

  text-align: center;

  margin-bottom:
  10px;

}

h1 span {

  color:
  #a855f7;

}

.subtitle {

  text-align:
  center;

  color:
  #94a3b8;

  margin-bottom:
  30px;

}

input,
textarea,
select {

  width: 100%;

  padding:
  14px;

  margin:
  7px 0 15px;

  background:
  #080d18;

  border:
  1px solid
  #29344d;

  border-radius:
  10px;

  color:
  white;

  outline:
  none;

}

textarea {

  min-height:
  100px;

  resize:
  vertical;

}

label {

  display:
  block;

  color:
  #cbd5e1;

  font-size:
  14px;

  font-weight:
  bold;

}

button {

  border:
  none;

  border-radius:
  10px;

  padding:
  13px 20px;

  cursor:
  pointer;

  font-weight:
  bold;

  color:
  white;

}

.primary {

  background:
  linear-gradient(
    135deg,
    #7c3aed,
    #ec4899
  );

}

.secondary {

  background:
  #1e293b;

}

.danger {

  background:
  #dc2626;

}

.success {

  background:
  #059669;

}

.hidden {

  display:
  none !important;

}

.grid {

  display:
  grid;

  grid-template-columns:
  repeat(
    2,
    1fr
  );

  gap:
  15px;

}

@media(
  max-width: 700px
) {

  .grid {

    grid-template-columns:
    1fr;

  }

}

.header {

  display:
  flex;

  justify-content:
  space-between;

  align-items:
  center;

  gap:
  15px;

  margin-bottom:
  25px;

}

.apk-item {

  display:
  flex;

  gap:
  15px;

  align-items:
  center;

  padding:
  15px;

  background:
  #0b1220;

  border:
  1px solid
  #26334c;

  border-radius:
  15px;

  margin-top:
  12px;

}

.apk-item img {

  width:
  65px;

  height:
  65px;

  object-fit:
  cover;

  border-radius:
  12px;

}

.apk-info {

  flex:
  1;

}

.apk-info h3 {

  margin:
  0 0 5px;

}

.apk-info p {

  margin:
  3px 0;

  color:
  #94a3b8;

  font-size:
  13px;

}

.actions {

  display:
  flex;

  gap:
  8px;

  flex-wrap:
  wrap;

}

.status {

  display:
  inline-block;

  padding:
  5px 9px;

  border-radius:
  20px;

  font-size:
  11px;

}

.online {

  background:
  #064e3b;

  color:
  #34d399;

}

.offline {

  background:
  #450a0a;

  color:
  #f87171;

}

</style>

</head>

<body>

<div class="container">


<!-- LOGIN -->

<div
id="loginBox"
class="card">

<h1>
FRENZY <span>CHEATS</span>
</h1>

<p class="subtitle">
Admin Panel
</p>

<label>
Admin Email
</label>

<input
id="email"
type="email"
placeholder="admin@example.com">

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Password">

<button
class="primary"
id="loginBtn">

LOGIN

</button>

<p
id="loginMessage">
</p>

</div>


<!-- ADMIN -->

<div
id="adminBox"
class="hidden">


<div class="header">

<h1>
FRENZY <span>CHEATS</span>
</h1>

<button
class="danger"
id="logoutBtn">

LOGOUT

</button>

</div>


<!-- ADD / EDIT -->

<div class="card">

<h2 id="formTitle">
Add New APK
</h2>


<div class="grid">


<div>

<label>
APK Name
</label>

<input
id="name"
placeholder="Example APK">


<label>
Category
</label>

<select id="category">

<option>
Android
</option>

<option>
Free Fire MAX
</option>

<option>
Game
</option>

<option>
Tools
</option>

</select>


<label>
Version
</label>

<input
id="version"
placeholder="v1.0.0">


<label>
Logo / Image URL
</label>

<input
id="logoUrl"
type="url"
placeholder="https://example.com/logo.png">


<label>
Direct APK Download URL
</label>

<input
id="downloadUrl"
type="url"
placeholder="https://example.com/file.apk">


<label>
Telegram Mirror URL
</label>

<input
id="telegramUrl"
type="url"
placeholder="https://t.me/...">

</div>


<div>

<label>
Badge
</label>

<input
id="badge"
placeholder="Official APK">


<label>
Compatibility
</label>

<input
id="compatibility"
placeholder="Android 7+">


<label>
Short Description
</label>

<input
id="shortDescription"
placeholder="Short description">


<label>
Full Description
</label>

<textarea
id="description"
placeholder="Write complete APK description...">
</textarea>


<label>
Features
</label>

<textarea
id="features"
placeholder="Feature 1
Feature 2
Feature 3
Feature 4">
</textarea>

</div>

</div>


<label>

<input
id="published"
type="checkbox"
style="width:auto">

 Publish on Website

</label>


<label>

<input
id="featured"
type="checkbox"
style="width:auto">

 Featured APK

</label>


<br>


<button
class="primary"
id="saveBtn">

PUBLISH APK

</button>


<button
class="secondary hidden"
id="cancelBtn">

CANCEL EDIT

</button>


<p
id="saveMessage">
</p>

</div>


<!-- APK LIST -->

<div class="card">

<h2>
Manage APKs
</h2>

<div
id="apkList">

Loading...

</div>

</div>


</div>

</div>


<script type="module">

import {

  auth,

  adminLogin,

  adminLogout,

  onAuthStateChanged,

  getAllAPKs,

  addAPK,

  updateAPK,

  deleteAPK

} from "./firebase.js";


let editingId = null;


// ============================================================
// ELEMENTS
// ============================================================

const loginBox =
document.getElementById(
  "loginBox"
);

const adminBox =
document.getElementById(
  "adminBox"
);

const loginMessage =
document.getElementById(
  "loginMessage"
);

const saveMessage =
document.getElementById(
  "saveMessage"
);


// ============================================================
// AUTH STATE
// ============================================================

onAuthStateChanged(
  auth,
  user => {

    if (user) {

      loginBox.classList.add(
        "hidden"
      );

      adminBox.classList.remove(
        "hidden"
      );

      loadAPKs();

    } else {

      loginBox.classList.remove(
        "hidden"
      );

      adminBox.classList.add(
        "hidden"
      );

    }

  }
);


// ============================================================
// LOGIN
// ============================================================

document
.getElementById(
  "loginBtn"
)
.addEventListener(
  "click",
  async () => {

    const email =
    document.getElementById(
      "email"
    ).value.trim();

    const password =
    document.getElementById(
      "password"
    ).value;

    try {

      loginMessage.textContent =
      "Logging in...";

      await adminLogin(
        email,
        password
      );

      loginMessage.textContent =
      "";

    } catch(error) {

      loginMessage.textContent =
      error.message;

    }

  }
);


// ============================================================
// LOGOUT
// ============================================================

document
.getElementById(
  "logoutBtn"
)
.addEventListener(
  "click",
  async () => {

    await adminLogout();

  }
);


// ============================================================
// GET FORM DATA
// ============================================================

function getFormData() {

  const featureText =
  document.getElementById(
    "features"
  ).value;

  const features =
  featureText
    .split("\n")
    .map(
      item =>
      item.trim()
    )
    .filter(
      item =>
      item.length > 0
    );

  return {

    name:
    document.getElementById(
      "name"
    ).value.trim(),

    category:
    document.getElementById(
      "category"
    ).value,

    version:
    document.getElementById(
      "version"
    ).value.trim(),

    logoUrl:
    document.getElementById(
      "logoUrl"
    ).value.trim(),

    downloadUrl:
    document.getElementById(
      "downloadUrl"
    ).value.trim(),

    telegramUrl:
    document.getElementById(
      "telegramUrl"
    ).value.trim(),

    compatibility:
    document.getElementById(
      "compatibility"
    ).value.trim(),

    badge:
    document.getElementById(
      "badge"
    ).value.trim(),

    shortDescription:
    document.getElementById(
      "shortDescription"
    ).value.trim(),

    description:
    document.getElementById(
      "description"
    ).value.trim(),

    features,

    published:
    document.getElementById(
      "published"
    ).checked,

    featured:
    document.getElementById(
      "featured"
    ).checked

  };

}


// ============================================================
// SAVE APK
// ============================================================

document
.getElementById(
  "saveBtn"
)
.addEventListener(
  "click",
  async () => {

    const data =
    getFormData();


    if (!data.name) {

      saveMessage.textContent =
      "APK name is required.";

      return;

    }


    if (!data.downloadUrl) {

      saveMessage.textContent =
      "APK download URL is required.";

      return;

    }


    try {

      saveMessage.textContent =
      "Saving...";


      if (editingId) {

        await updateAPK(
          editingId,
          data
        );

        saveMessage.textContent =
        "APK updated successfully.";

      } else {

        await addAPK(
          data
        );

        saveMessage.textContent =
        "APK added successfully.";

      }


      resetForm();

      loadAPKs();

    } catch(error) {

      saveMessage.textContent =
      error.message;

    }

  }
);


// ============================================================
// LOAD APKs
// ============================================================

async function loadAPKs() {

  const list =
  document.getElementById(
    "apkList"
  );

  try {

    const apks =
    await getAllAPKs();


    if (!apks.length) {

      list.innerHTML =
      "<p>No APKs added yet.</p>";

      return;

    }


    list.innerHTML =
    "";


    apks.forEach(
      apk => {

        const div =
        document.createElement(
          "div"
        );

        div.className =
        "apk-item";


        div.innerHTML = `

          <img
          src="${escapeHTML(
            apk.logoUrl ||
            "https://via.placeholder.com/100"
          )}"
          onerror="this.src='https://via.placeholder.com/100'"
          >

          <div class="apk-info">

            <h3>
              ${escapeHTML(
                apk.name
              )}
            </h3>

            <p>
              ${escapeHTML(
                apk.version || ""
              )}
            </p>

            <p>
              Downloads:
              ${apk.downloadCount || 0}
            </p>

            <span class="status ${
              apk.published
              ? "online"
              : "offline"
            }">

              ${
                apk.published
                ? "PUBLISHED"
                : "HIDDEN"
              }

            </span>

          </div>

          <div class="actions">

            <button
            class="secondary"
            data-edit="${apk.id}">

            EDIT

            </button>

            <button
            class="danger"
            data-delete="${apk.id}">

            DELETE

            </button>

          </div>

        `;


        list.appendChild(
          div
        );

      }
    );


    document
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const apk =
            apks.find(
              item =>
              item.id ===
              button.dataset.edit
            );

            editAPK(
              apk
            );

          }
        );

      }
    );


    document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            if (
              !confirm(
                "Delete this APK?"
              )
            ) return;


            try {

              await deleteAPK(
                button.dataset.delete
              );

              loadAPKs();

            } catch(error) {

              alert(
                error.message
              );

            }

          }
        );

      }
    );


  } catch(error) {

    list.innerHTML =
    `<p>${escapeHTML(
      error.message
    )}</p>`;

  }

}


// ============================================================
// EDIT APK
// ============================================================

function editAPK(
  apk
) {

  editingId =
  apk.id;


  document
  .getElementById(
    "formTitle"
  )
  .textContent =
  "Edit APK";


  document
  .getElementById(
    "saveBtn"
  )
  .textContent =
  "UPDATE APK";


  document
  .getElementById(
    "cancelBtn"
  )
  .classList.remove(
    "hidden"
  );


  document
  .getElementById(
    "name"
  ).value =
  apk.name || "";


  document
  .getElementById(
    "category"
  ).value =
  apk.category || "Android";


  document
  .getElementById(
    "version"
  ).value =
  apk.version || "";


  document
  .getElementById(
    "logoUrl"
  ).value =
  apk.logoUrl || "";


  document
  .getElementById(
    "downloadUrl"
  ).value =
  apk.downloadUrl || "";


  document
  .getElementById(
    "telegramUrl"
  ).value =
  apk.telegramUrl || "";


  document
  .getElementById(
    "compatibility"
  ).value =
  apk.compatibility || "";


  document
  .getElementById(
    "badge"
  ).value =
  apk.badge || "";


  document
  .getElementById(
    "shortDescription"
  ).value =
  apk.shortDescription || "";


  document
  .getElementById(
    "description"
  ).value =
  apk.description || "";


  document
  .getElementById(
    "features"
  ).value =
  (
    apk.features || []
  ).join(
    "\n"
  );


  document
  .getElementById(
    "published"
  ).checked =
  apk.published === true;


  document
  .getElementById(
    "featured"
  ).checked =
  apk.featured === true;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// ============================================================
// RESET FORM
// ============================================================

function resetForm() {

  editingId =
  null;


  document
  .getElementById(
    "formTitle"
  )
  .textContent =
  "Add New APK";


  document
  .getElementById(
    "saveBtn"
  )
  .textContent =
  "PUBLISH APK";


  document
  .getElementById(
    "cancelBtn"
  )
  .classList.add(
    "hidden"
  );


  document
  .querySelectorAll(
    "input:not([type=checkbox]), textarea"
  )
  .forEach(
    input =>
    input.value = ""
  );


  document
  .getElementById(
    "published"
  ).checked =
  false;


  document
  .getElementById(
    "featured"
  ).checked =
  false;

}


// ============================================================
// CANCEL EDIT
// ============================================================

document
.getElementById(
  "cancelBtn"
)
.addEventListener(
  "click",
  resetForm
);


// ============================================================
// BASIC HTML ESCAPE
// ============================================================

function escapeHTML(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
