<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>FRENZY CHEATS - Admin Panel</title>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top left,
      #24104c,
      transparent 35%
    ),
    #050812;

  color: #ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.container {

  width: 95%;

  max-width: 1100px;

  margin: 40px auto;

}

.card {

  background: #0d1525;

  border: 1px solid #29344d;

  border-radius: 20px;

  padding: 30px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.4);

}

h1 {

  text-align: center;

  margin-top: 0;

}

.logo-text {

  color: #a855f7;

}

.subtitle {

  text-align: center;

  color: #9ca9c2;

  margin-bottom: 30px;

}

label {

  display: block;

  margin-top: 18px;

  margin-bottom: 7px;

  color: #cbd5e1;

  font-weight: bold;

}

input,
textarea,
select {

  width: 100%;

  padding: 14px;

  border-radius: 10px;

  border: 1px solid #334155;

  background: #070b14;

  color: white;

  font-size: 15px;

  outline: none;

}

textarea {

  min-height: 110px;

  resize: vertical;

}

input:focus,
textarea:focus,
select:focus {

  border-color: #a855f7;

}

button {

  border: none;

  border-radius: 10px;

  padding: 13px 20px;

  cursor: pointer;

  font-weight: bold;

  color: white;

}

.login-btn,
.save-btn {

  width: 100%;

  margin-top: 25px;

  background:
    linear-gradient(
      90deg,
      #7c3aed,
      #ec4899
    );

  font-size: 16px;

}

.logout-btn {

  background: #dc2626;

  margin-bottom: 25px;

}

.delete-btn {

  background: #dc2626;

}

.edit-btn {

  background: #7c3aed;

}

.status {

  margin-top: 15px;

  padding: 12px;

  border-radius: 8px;

  display: none;

}

.success {

  display: block;

  background: #064e3b;

  color: #6ee7b7;

}

.error {

  display: block;

  background: #7f1d1d;

  color: #fecaca;

}

#adminPanel {

  display: none;

}

.grid {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(250px, 1fr)
    );

  gap: 15px;

}

.apk-list {

  margin-top: 40px;

}

.apk-card {

  background: #080e1b;

  border: 1px solid #26344e;

  border-radius: 15px;

  padding: 20px;

  margin-top: 15px;

}

.apk-card img {

  width: 70px;

  height: 70px;

  object-fit: cover;

  border-radius: 15px;

  margin-bottom: 10px;

}

.apk-card h3 {

  margin: 5px 0;

}

.apk-card p {

  color: #9ca9c2;

}

.actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}

.actions button {

  flex: 1;

}

.hidden {

  display: none !important;

}

</style>

</head>


<body>


<div class="container">


<!-- ===================================================== -->
<!-- LOGIN -->
<!-- ===================================================== -->

<div
  class="card"
  id="loginScreen"
>

<h1>
  FRENZY
  <span class="logo-text">
    CHEATS
  </span>
</h1>

<div class="subtitle">
  Admin Panel
</div>


<label>
  Admin Email
</label>

<input
  type="email"
  id="email"
  placeholder="Enter admin email"
>


<label>
  Password
</label>

<input
  type="password"
  id="password"
  placeholder="Enter password"
>


<button
  class="login-btn"
  id="loginBtn"
>
  LOGIN
</button>


<div
  class="status"
  id="loginStatus"
></div>

</div>



<!-- ===================================================== -->
<!-- ADMIN PANEL -->
<!-- ===================================================== -->

<div
  class="card"
  id="adminPanel"
>

<h1>
  FRENZY
  <span class="logo-text">
    CHEATS
  </span>
</h1>

<div class="subtitle">
  APK Download Manager
</div>


<button
  class="logout-btn"
  id="logoutBtn"
>
  LOGOUT
</button>


<!-- ===================================================== -->
<!-- APK FORM -->
<!-- ===================================================== -->

<h2>
  Add / Edit APK
</h2>


<input
  type="hidden"
  id="editingId"
>


<div class="grid">


<div>

<label>
  APK Name
</label>

<input
  id="apkName"
  placeholder="Rapid Core APK"
>

</div>


<div>

<label>
  Category
</label>

<select id="apkCategory">

<option>
Android
</option>

<option>
Free Fire
</option>

<option>
Free Fire MAX
</option>

<option>
Tools
</option>

</select>

</div>


<div>

<label>
  Version
</label>

<input
  id="apkVersion"
  placeholder="v1.0.0"
>

</div>


<div>

<label>
  Logo Image URL
</label>

<input
  id="logoUrl"
  placeholder="https://example.com/logo.png"
>

</div>


<div>

<label>
  Direct APK Download URL
</label>

<input
  id="downloadUrl"
  placeholder="https://example.com/app.apk"
>

</div>


<div>

<label>
  Telegram URL
</label>

<input
  id="telegramUrl"
  placeholder="https://t.me/yourchannel"
>

</div>


<div>

<label>
  Compatibility
</label>

<input
  id="compatibility"
  placeholder="Android 7+"
>

</div>


<div>

<label>
  Badge
</label>

<input
  id="badge"
  placeholder="Official APK"
>

</div>

</div>


<label>
  Short Description
</label>

<textarea
  id="shortDescription"
  placeholder="Short APK description..."
></textarea>


<label>
  Full Description
</label>

<textarea
  id="description"
  placeholder="Write complete APK details..."
></textarea>


<label>
  Features
  <small>
    One feature per line
  </small>
</label>

<textarea
  id="features"
  placeholder="Feature 1&#10;Feature 2&#10;Feature 3"
></textarea>


<div class="grid">

<div>

<label>
  Published
</label>

<select id="published">

<option value="true">
Yes
</option>

<option value="false">
No
</option>

</select>

</div>


<div>

<label>
  Featured
</label>

<select id="featured">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>

</div>


<button
  class="save-btn"
  id="saveBtn"
>
  ADD APK
</button>


<div
  class="status"
  id="formStatus"
></div>



<!-- ===================================================== -->
<!-- APK LIST -->
<!-- ===================================================== -->

<div class="apk-list">

<h2>
  Your APKs
</h2>

<div id="apkList">

Loading...

</div>

</div>


</div>


</div>



<!-- ===================================================== -->
<!-- FIREBASE SDK -->
<!-- ===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- YOUR FIREBASE FILE -->

<script src="firebase.js"></script>



<script>


// ============================================================
// ELEMENTS
// ============================================================

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const adminPanel =
  document.getElementById(
    "adminPanel"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const formStatus =
  document.getElementById(
    "formStatus"
  );

const apkList =
  document.getElementById(
    "apkList"
  );


// ============================================================
// LOGIN
// ============================================================

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    loginStatus.className =
      "status";

    loginStatus.style.display =
      "block";

    loginStatus.textContent =
      "Logging in...";


    try {

      await adminLogin(
        email,
        password
      );

      showAdminPanel();

    }

    catch (error) {

      console.error(error);

      loginStatus.className =
        "status error";

      loginStatus.textContent =
        "Login failed: " +
        error.message;

    }

  }

);


// ============================================================
// ENTER KEY LOGIN
// ============================================================

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        loginBtn.click();

      }

    }

  );


// ============================================================
// LOGOUT
// ============================================================

logoutBtn.addEventListener(
  "click",
  async () => {

    await adminLogout();

  }

);


// ============================================================
// SHOW ADMIN
// ============================================================

function showAdminPanel() {

  loginScreen.style.display =
    "none";

  adminPanel.style.display =
    "block";

  loadAPKs();

}


// ============================================================
// AUTH STATE
// ============================================================

checkAdminLogin(
  user => {

    if (user) {

      showAdminPanel();

    }

    else {

      loginScreen.style.display =
        "block";

      adminPanel.style.display =
        "none";

    }

  }

);


// ============================================================
// SAVE APK
// ============================================================

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    async () => {

      const editingId =
        document
          .getElementById(
            "editingId"
          )
          .value;


      const data = {

        name:
          document
            .getElementById(
              "apkName"
            )
            .value
            .trim(),

        category:
          document
            .getElementById(
              "apkCategory"
            )
            .value,

        version:
          document
            .getElementById(
              "apkVersion"
            )
            .value
            .trim(),

        logoUrl:
          document
            .getElementById(
              "logoUrl"
            )
            .value
            .trim(),

        downloadUrl:
          document
            .getElementById(
              "downloadUrl"
            )
            .value
            .trim(),

        telegramUrl:
          document
            .getElementById(
              "telegramUrl"
            )
            .value
            .trim(),

        compatibility:
          document
            .getElementById(
              "compatibility"
            )
            .value
            .trim(),

        badge:
          document
            .getElementById(
              "badge"
            )
            .value
            .trim(),

        shortDescription:
          document
            .getElementById(
              "shortDescription"
            )
            .value
            .trim(),

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim(),

        features:
          document
            .getElementById(
              "features"
            )
            .value
            .split("\n")
            .map(
              x => x.trim()
            )
            .filter(Boolean),

        published:
          document
            .getElementById(
              "published"
            )
            .value === "true",

        featured:
          document
            .getElementById(
              "featured"
            )
            .value === "true"

      };


      if (!data.name) {

        showFormStatus(
          "APK name is required.",
          false
        );

        return;

      }


      try {

        if (editingId) {

          await updateAPK(
            editingId,
            data
          );

          showFormStatus(
            "APK updated successfully!",
            true
          );

        }

        else {

          await addAPK(
            data
          );

          showFormStatus(
            "APK added successfully!",
            true
          );

        }


        clearForm();

        loadAPKs();

      }

      catch (error) {

        console.error(error);

        showFormStatus(
          error.message,
          false
        );

      }

    }

  );


// ============================================================
// LOAD APKs
// ============================================================

async function loadAPKs() {

  apkList.innerHTML =
    "Loading...";


  try {

    const apks =
      await getAllAPKs();


    if (!apks.length) {

      apkList.innerHTML =
        "No APKs found.";

      return;

    }


    apkList.innerHTML =
      "";


    apks.forEach(
      apk => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "apk-card";


        card.innerHTML = `

          ${
            apk.logoUrl
            ?
            `<img
              src="${escapeHTML(
                apk.logoUrl
              )}"
              alt="Logo"
            >`
            :
            ""
          }

          <h3>
            ${escapeHTML(
              apk.name
            )}
          </h3>

          <p>
            ${escapeHTML(
              apk.shortDescription ||
              ""
            )}
          </p>

          <p>
            Downloads:
            ${
              apk.downloadCount ||
              0
            }
          </p>

          <p>
            Status:
            ${
              apk.published
              ? "Published"
              : "Hidden"
            }
          </p>

          <div class="actions">

            <button
              class="edit-btn"
              onclick="editAPK('${apk.id}')"
            >
              EDIT
            </button>

            <button
              class="delete-btn"
              onclick="removeAPK('${apk.id}')"
            >
              DELETE
            </button>

          </div>

        `;


        apkList.appendChild(
          card
        );

      }

    );

  }

  catch (error) {

    console.error(error);

    apkList.innerHTML =
      "Error loading APKs: " +
      error.message;

  }

}


// ============================================================
// EDIT APK
// ============================================================

window.editAPK =
  async function(id) {

    const apks =
      await getAllAPKs();

    const apk =
      apks.find(
        item =>
          item.id === id
      );


    if (!apk) return;


    document
      .getElementById(
        "editingId"
      )
      .value =
      apk.id;


    document
      .getElementById(
        "apkName"
      )
      .value =
      apk.name || "";


    document
      .getElementById(
        "apkCategory"
      )
      .value =
      apk.category || "Android";


    document
      .getElementById(
        "apkVersion"
      )
      .value =
      apk.version || "";


    document
      .getElementById(
        "logoUrl"
      )
      .value =
      apk.logoUrl || "";


    document
      .getElementById(
        "downloadUrl"
      )
      .value =
      apk.downloadUrl || "";


    document
      .getElementById(
        "telegramUrl"
      )
      .value =
      apk.telegramUrl || "";


    document
      .getElementById(
        "compatibility"
      )
      .value =
      apk.compatibility || "";


    document
      .getElementById(
        "badge"
      )
      .value =
      apk.badge || "";


    document
      .getElementById(
        "shortDescription"
      )
      .value =
      apk.shortDescription || "";


    document
      .getElementById(
        "description"
      )
      .value =
      apk.description || "";


    document
      .getElementById(
        "features"
      )
      .value =
      (apk.features || [])
        .join("\n");


    document
      .getElementById(
        "published"
      )
      .value =
      apk.published
      ? "true"
      : "false";


    document
      .getElementById(
        "featured"
      )
      .value =
      apk.featured
      ? "true"
      : "false";


    document
      .getElementById(
        "saveBtn"
      )
      .textContent =
      "UPDATE APK";


    window.scrollTo(
      0,
      0
    );

  };


// ============================================================
// DELETE APK
// ============================================================

window.removeAPK =
  async function(id) {

    if (
      !confirm(
        "Are you sure you want to delete this APK?"
      )
    ) {

      return;

    }


    try {

      await deleteAPK(
        id
      );

      loadAPKs();

    }

    catch (error) {

      alert(
        error.message
      );

    }

  };


// ============================================================
// CLEAR FORM
// ============================================================

function clearForm() {

  document
    .getElementById(
      "editingId"
    )
    .value =
    "";


  document
    .getElementById(
      "apkName"
    )
    .value =
    "";


  document
    .getElementById(
      "apkVersion"
    )
    .value =
    "";


  document
    .getElementById(
      "logoUrl"
    )
    .value =
    "";


  document
    .getElementById(
      "downloadUrl"
    )
    .value =
    "";


  document
    .getElementById(
      "telegramUrl"
    )
    .value =
    "";


  document
    .getElementById(
      "compatibility"
    )
    .value =
    "";


  document
    .getElementById(
      "badge"
    )
    .value =
    "";


  document
    .getElementById(
      "shortDescription"
    )
    .value =
    "";


  document
    .getElementById(
      "description"
    )
    .value =
    "";


  document
    .getElementById(
      "features"
    )
    .value =
    "";


  document
    .getElementById(
      "saveBtn"
    )
    .textContent =
    "ADD APK";

}


// ============================================================
// STATUS
// ============================================================

function showFormStatus(
  message,
  success
) {

  formStatus.className =
    success
    ? "status success"
    : "status error";

  formStatus.textContent =
    message;

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value || "");

  return div.innerHTML;

}

</script>


</body>

</html>
