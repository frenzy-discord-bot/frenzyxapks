<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
FRENZY CHEATS - Admin Panel
</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at top left,
        #241044,
        transparent 35%
    ),
    #050816;

    color:white;

    font-family:
    Arial,
    sans-serif;

}


button,
input,
textarea,
select{

    font-family:inherit;

}


button{

    cursor:pointer;

}


/* LOGIN */

#loginPage{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


.loginBox{

    width:100%;

    max-width:420px;

    padding:35px;

    border-radius:20px;

    background:
    rgba(15,23,42,.9);

    border:
    1px solid
    rgba(168,85,247,.3);

    box-shadow:
    0 0 50px
    rgba(124,58,237,.15);

}


.loginBox h1{

    text-align:center;

    margin-bottom:10px;

}


.loginBox p{

    text-align:center;

    color:#94a3b8;

    margin-bottom:30px;

}


.inputGroup{

    margin-bottom:18px;

}


.inputGroup label{

    display:block;

    margin-bottom:7px;

    color:#cbd5e1;

    font-size:13px;

}


.inputGroup input,
.inputGroup textarea,
.inputGroup select{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:
    1px solid
    #334155;

    background:#0f172a;

    color:white;

    outline:none;

}


.inputGroup textarea{

    min-height:100px;

    resize:vertical;

}


.inputGroup input:focus,
.inputGroup textarea:focus,
.inputGroup select:focus{

    border-color:#a855f7;

}


.loginBtn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7c3aed,
        #db2777
    );

}


#errorMessage{

    color:#f87171;

    text-align:center;

    margin-top:15px;

    font-size:13px;

}


/* ADMIN */

#adminPage{

    display:none;

}


.navbar{

    position:sticky;

    top:0;

    z-index:10;

    padding:18px 25px;

    display:flex;

    justify-content:
    space-between;

    align-items:center;

    background:
    rgba(3,5,12,.9);

    backdrop-filter:
    blur(15px);

    border-bottom:
    1px solid
    #1e293b;

}


.logo{

    font-size:20px;

    font-weight:bold;

}


.logo span{

    color:#a855f7;

}


.logoutBtn{

    padding:
    10px 18px;

    border-radius:8px;

    border:
    1px solid
    #ef4444;

    color:#f87171;

    background:
    transparent;

}


.container{

    max-width:1200px;

    margin:auto;

    padding:35px 20px;

}


.dashboard{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:25px;

}


.panel{

    background:
    rgba(15,23,42,.8);

    border:
    1px solid
    #1e293b;

    border-radius:18px;

    padding:25px;

}


.panel h2{

    margin-bottom:25px;

}


.formGrid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:15px;

}


.full{

    grid-column:
    1 / -1;

}


.checkbox{

    display:flex;

    align-items:center;

    gap:10px;

    margin:
    15px 0;

}


.checkbox input{

    width:18px;

    height:18px;

}


.saveBtn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        #7c3aed,
        #db2777
    );

}


.cancelBtn{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:
    1px solid
    #334155;

    border-radius:10px;

    background:
    transparent;

    color:white;

    display:none;

}


.apkList{

    display:grid;

    gap:15px;

}


.apkItem{

    display:flex;

    align-items:center;

    gap:15px;

    padding:15px;

    border-radius:12px;

    background:
    #0b1120;

    border:
    1px solid
    #1e293b;

}


.apkItem img{

    width:55px;

    height:55px;

    object-fit:cover;

    border-radius:12px;

}


.apkInfo{

    flex:1;

}


.apkInfo h3{

    margin-bottom:5px;

}


.apkInfo p{

    color:#64748b;

    font-size:12px;

}


.actions{

    display:flex;

    gap:7px;

}


.editBtn,
.deleteBtn{

    padding:
    8px 12px;

    border-radius:7px;

    border:none;

    color:white;

}


.editBtn{

    background:#2563eb;

}


.deleteBtn{

    background:#dc2626;

}


.status{

    padding:
    10px;

    margin-bottom:15px;

    border-radius:8px;

    display:none;

}


.success{

    display:block;

    background:
    rgba(34,197,94,.1);

    color:#4ade80;

}


.error{

    display:block;

    background:
    rgba(239,68,68,.1);

    color:#f87171;

}


@media(max-width:800px){

    .dashboard{

        grid-template-columns:
        1fr;

    }

}


@media(max-width:550px){

    .formGrid{

        grid-template-columns:
        1fr;

    }

    .full{

        grid-column:
        auto;

    }

    .apkItem{

        flex-wrap:wrap;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginPage">

<div class="loginBox">

<h1>
FRENZY CHEATS
</h1>

<p>
Secure Admin Panel
</p>


<form id="loginForm">


<div class="inputGroup">

<label>
Admin Email
</label>

<input
type="email"
id="email"
placeholder="Enter admin email"
autocomplete="username"
required
>

</div>


<div class="inputGroup">

<label>
Admin Password
</label>

<input
type="password"
id="password"
placeholder="Enter password"
autocomplete="current-password"
required
>

</div>


<button
class="loginBtn"
type="submit"
>

LOGIN TO ADMIN PANEL

</button>


<div
id="errorMessage"
></div>


</form>

</div>

</div>


<!-- =========================================================
     ADMIN PANEL
========================================================= -->

<div id="adminPage">


<nav class="navbar">

<div class="logo">

FRENZY
<span>CHEATS</span>

</div>


<button
class="logoutBtn"
id="logoutBtn"
>

LOGOUT

</button>

</nav>


<div class="container">


<div
id="statusMessage"
class="status"
></div>


<div class="dashboard">


<!-- =====================================================
     ADD / EDIT
===================================================== -->

<div class="panel">

<h2>
Add / Edit APK
</h2>


<form id="apkForm">


<div class="formGrid">


<div class="inputGroup">

<label>
APK Name *
</label>

<input
type="text"
id="apkName"
required
>

</div>


<div class="inputGroup">

<label>
Version
</label>

<input
type="text"
id="apkVersion"
placeholder="v1.0.0"
>

</div>


<div class="inputGroup">

<label>
Category
</label>

<select
id="apkCategory"
>

<option>
Android
</option>

<option>
Free Fire
</option>

<option>
Free Fire MAX
</option>

<option>
Tools
</option>

</select>

</div>


<div class="inputGroup">

<label>
Badge
</label>

<input
type="text"
id="apkBadge"
value="AVAILABLE"
>

</div>


<div class="inputGroup full">

<label>
Logo Image URL
</label>

<input
type="url"
id="logoUrl"
placeholder="https://example.com/logo.png"
>

</div>


<div class="inputGroup full">

<label>
APK Download URL *
</label>

<input
type="url"
id="downloadUrl"
placeholder="https://example.com/app.apk"
required
>

</div>


<div class="inputGroup full">

<label>
Short Description
</label>

<input
type="text"
id="shortDescription"
placeholder="Short description for card"
>

</div>


<div class="inputGroup full">

<label>
Full Description
</label>

<textarea
id="description"
placeholder="Write complete APK details..."
></textarea>

</div>


<div class="inputGroup full">

<label>
Features

</label>

<input
type="text"
id="features"
placeholder="ESP, AIM, Fast, Stable"
>

</div>


</div>


<label class="checkbox">

<input
type="checkbox"
id="published"
checked
>

Publish this APK on website

</label>


<button
class="saveBtn"
type="submit"
>

SAVE APK

</button>


<button
class="cancelBtn"
type="button"
id="cancelEdit"
>

CANCEL EDIT

</button>


</form>

</div>


<!-- =====================================================
     APK LIST
===================================================== -->

<div class="panel">

<h2>
Published APKs
</h2>


<div
class="apkList"
id="apkList"
>

Loading...

</div>

</div>


</div>

</div>

</div>


<!-- =========================================================
     FIREBASE SDK
========================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- Firebase Config -->

<script src="firebase.js"></script>


<script>


let editingId = null;

let apkCache = [];


// ============================================================
// AUTH STATE
// ============================================================

frenzyAuth.onAuthStateChanged(

    user => {

        if(user){

            document
            .getElementById(
                "loginPage"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "adminPage"
            )
            .style.display =
                "block";


            loadAPKs();

        }

        else{

            document
            .getElementById(
                "loginPage"
            )
            .style.display =
                "flex";


            document
            .getElementById(
                "adminPage"
            )
            .style.display =
                "none";

        }

    }

);


// ============================================================
// LOGIN
// ============================================================

document
.getElementById(
    "loginForm"
)
.addEventListener(

    "submit",

    async function(e){

        e.preventDefault();


        const email =

            document
            .getElementById(
                "email"
            )
            .value;


        const password =

            document
            .getElementById(
                "password"
            )
            .value;


        const error =

            document
            .getElementById(
                "errorMessage"
            );


        error.textContent =
            "Logging in...";


        try{

            await adminLogin(
                email,
                password
            );


            error.textContent =
                "";

        }

        catch(err){

            console.error(
                err
            );


            error.textContent =

                getFirebaseError(
                    err
                );

        }

    }

);


// ============================================================
// LOGOUT
// ============================================================

document
.getElementById(
    "logoutBtn"
)
.addEventListener(

    "click",

    async function(){

        await adminLogout();

    }

);


// ============================================================
// SAVE APK
// ============================================================

document
.getElementById(
    "apkForm"
)
.addEventListener(

    "submit",

    async function(e){

        e.preventDefault();


        const featuresText =

            document
            .getElementById(
                "features"
            )
            .value;


        const data = {

            name:

                document
                .getElementById(
                    "apkName"
                )
                .value
                .trim(),


            version:

                document
                .getElementById(
                    "apkVersion"
                )
                .value
                .trim(),


            category:

                document
                .getElementById(
                    "apkCategory"
                )
                .value,


            badge:

                document
                .getElementById(
                    "apkBadge"
                )
                .value
                .trim(),


            logoUrl:

                document
                .getElementById(
                    "logoUrl"
                )
                .value
                .trim(),


            downloadUrl:

                document
                .getElementById(
                    "downloadUrl"
                )
                .value
                .trim(),


            shortDescription:

                document
                .getElementById(
                    "shortDescription"
                )
                .value
                .trim(),


            description:

                document
                .getElementById(
                    "description"
                )
                .value
                .trim(),


            features:

                featuresText

                ?

                featuresText
                .split(",")
                .map(
                    x =>
                    x.trim()
                )
                .filter(
                    Boolean
                )

                :

                [],


            published:

                document
                .getElementById(
                    "published"
                )
                .checked

        };


        try{


            if(editingId){

                await updateAPK(
                    editingId,
                    data
                );


                showStatus(
                    "APK updated successfully!",
                    "success"
                );

            }

            else{

                await addAPK(
                    data
                );


                showStatus(
                    "APK added successfully!",
                    "success"
                );

            }


            resetForm();

            loadAPKs();


        }

        catch(err){

            console.error(
                err
            );


            showStatus(
                err.message,
                "error"
            );

        }

    }

);


// ============================================================
// LOAD APKs
// ============================================================

async function loadAPKs(){

    const list =

        document
        .getElementById(
            "apkList"
        );


    list.innerHTML =
        "Loading...";


    try{

        apkCache =
            await getAllAPKs();


        if(!apkCache.length){

            list.innerHTML =

                "No APKs added yet.";

            return;

        }


        list.innerHTML =
            "";


        apkCache.forEach(

            apk => {


                const item =

                    document
                    .createElement(
                        "div"
                    );


                item.className =
                    "apkItem";


                item.innerHTML = `

                    <img
                    src="${
                        escapeHTML(
                            apk.logoUrl ||
                            ""
                        )
                    }"
                    onerror="
                    this.style.display='none'
                    "
                    >

                    <div
                    class="apkInfo"
                    >

                    <h3>

                    ${escapeHTML(
                        apk.name
                    )}

                    </h3>

                    <p>

                    ${escapeHTML(
                        apk.category ||
                        ""
                    )}

                    •

                    ${
                        apk.published
                        ?
                        "Published"
                        :
                        "Hidden"
                    }

                    •

                    ${
                        apk.downloadCount ||
                        0
                    }

                    downloads

                    </p>

                    </div>


                    <div
                    class="actions"
                    >

                    <button
                    class="editBtn"
                    onclick="
                    editAPK(
                        '${apk.id}'
                    )
                    "
                    >

                    Edit

                    </button>


                    <button
                    class="deleteBtn"
                    onclick="
                    removeAPK(
                        '${apk.id}'
                    )
                    "
                    >

                    Delete

                    </button>

                    </div>

                `;


                list.appendChild(
                    item
                );

            }

        );

    }

    catch(err){

        console.error(
            err
        );


        list.innerHTML =

            "Error loading APKs.";

    }

}


// ============================================================
// EDIT
// ============================================================

window.editAPK = function(id){

    const apk =

        apkCache.find(
            x =>
            x.id === id
        );


    if(!apk){

        return;

    }


    editingId =
        id;


    document
    .getElementById(
        "apkName"
    )
    .value =
        apk.name ||
        "";


    document
    .getElementById(
        "apkVersion"
    )
    .value =
        apk.version ||
        "";


    document
    .getElementById(
        "apkCategory"
    )
    .value =
        apk.category ||
        "Android";


    document
    .getElementById(
        "apkBadge"
    )
    .value =
        apk.badge ||
        "";


    document
    .getElementById(
        "logoUrl"
    )
    .value =
        apk.logoUrl ||
        "";


    document
    .getElementById(
        "downloadUrl"
    )
    .value =
        apk.downloadUrl ||
        "";


    document
    .getElementById(
        "shortDescription"
    )
    .value =
        apk.shortDescription ||
        "";


    document
    .getElementById(
        "description"
    )
    .value =
        apk.description ||
        "";


    document
    .getElementById(
        "features"
    )
    .value =

        Array.isArray(
            apk.features
        )

        ?

        apk.features.join(
            ", "
        )

        :

        "";


    document
    .getElementById(
        "published"
    )
    .checked =

        apk.published === true;


    document
    .getElementById(
        "cancelEdit"
    )
    .style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:
            "smooth"

    });

};


// ============================================================
// DELETE
// ============================================================

window.removeAPK = async function(id){

    const confirmDelete =

        confirm(
            "Are you sure you want to delete this APK?"
        );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteAPK(
            id
        );


        showStatus(
            "APK deleted successfully!",
            "success"
        );


        loadAPKs();

    }

    catch(err){

        showStatus(
            err.message,
            "error"
        );

    }

};


// ============================================================
// CANCEL EDIT
// ============================================================

document
.getElementById(
    "cancelEdit"
)
.addEventListener(

    "click",

    resetForm

);


function resetForm(){

    editingId =
        null;


    document
    .getElementById(
        "apkForm"
    )
    .reset();


    document
    .getElementById(
        "published"
    )
    .checked =
        true;


    document
    .getElementById(
        "cancelEdit"
    )
    .style.display =
        "none";

}


// ============================================================
// STATUS
// ============================================================

function showStatus(
    message,
    type
){

    const box =

        document
        .getElementById(
            "statusMessage"
        );


    box.textContent =
        message;


    box.className =

        "status " +

        type;


    setTimeout(

        () => {

            box.className =
                "status";

        },

        4000

    );

}


// ============================================================
// FIREBASE ERROR
// ============================================================

function getFirebaseError(
    error
){

    switch(
        error.code
    ){

        case
        "auth/invalid-credential":

            return "Invalid email or password.";

        case
        "auth/invalid-email":

            return "Invalid email address.";

        case
        "auth/user-not-found":

            return "Admin account not found.";

        case
        "auth/wrong-password":

            return "Incorrect password.";

        case
        "auth/too-many-requests":

            return "Too many login attempts. Try again later.";

        default:

            return (
                error.message ||
                "Login failed."
            );

    }

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(
    value
){

    const div =
        document
        .createElement(
            "div"
        );


    div.textContent =
        String(
            value ||
            ""
        );


    return div.innerHTML;

}


</script>


</body>

</html>
